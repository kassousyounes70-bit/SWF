[package]
name = "yk-pubengine"
version = "1.0.0"
description = "YK PubEngine Desktop Application"
authors = ["YK Publishing"]
edition = "2021"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
getrandom = "0.3"
reqwest = { version = "0.12.23", default-features = false, features = ["rustls-tls", "json"] }
rustls = "0.23.44"
webpki-roots = "1.0"
x509-parser = "0.16"
base64 = "0.22"

[target."cfg(windows)".dependencies]
winreg = "0.55"

[features]
custom-protocol = ["tauri/custom-protocol"]
