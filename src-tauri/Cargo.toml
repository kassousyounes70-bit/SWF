[package]
name = "yk-pubengine"
version = "1.0.0"
description = "YK PubEngine Desktop Application"
authors = ["YK Publishing"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.6", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
