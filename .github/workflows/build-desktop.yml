name: Build Windows Desktop EXE

on:
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Create Valid Default Icon File
        run: |
          mkdir -p src-tauri/icons
          node -e "const fs = require('fs'); const buf = Buffer.from('', 'base64'); fs.writeFileSync('src-tauri/icons/icon.ico', buf);"

      - name: Install Tauri CLI
        run: npm install @tauri-apps/cli@v1

      - name: Build Tauri EXE directly
        run: npx tauri build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YK-PubEngine-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
