name: Build Windows Desktop EXE

on:
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install @tauri-apps/cli@v1

      - name: Generate Valid PNG and Tauri Icons
        shell: pwsh
        run: |
          New-Item -Path "src-tauri" -ItemType Directory -Force
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(512, 512)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.Clear([System.Drawing.Color]::RoyalBlue)
          $bmp.Save("src-tauri/app-icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose()
          $bmp.Dispose()
          npx tauri icon src-tauri/app-icon.png

      - name: Build Tauri EXE directly
        run: npx tauri build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YK-PubEngine-Windows
          path: src-tauri/target/release/bundle/nsis/*.exe
