name: Build Windows Desktop Portable EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Verify W5 secure-network files
        shell: pwsh
        run: |
          $required = @(
            "src-tauri/Cargo.toml",
            "src-tauri/src/main.rs",
            "src-tauri/src/secure_network.rs",
            "src-tauri/src/security_checks.rs",
            "src-tauri/src/startup_gate.rs",
            "web-source/desktop-auth.js",
            "web-source/security-guard.js",
            "scripts/obfuscate-desktop-shell.js",
            "functions/server.js",
            "src-tauri/tauri.conf.json",
            "src-tauri/build.rs"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              Write-Error "Required W5/build file is missing: $file"
              exit 1
            }
          }
          Write-Host "All required W5/build files are present."

      - name: Install JavaScript dependencies
        run: npm install

      - name: Generate app icons from source logo
        run: npx tauri icon src-tauri/icons/source.png

      - name: Obfuscate and merge desktop login shell
        run: |
          npm install --no-save javascript-obfuscator@4.1.1
          node scripts/obfuscate-desktop-shell.js

      - name: Build Portable EXE (W5)
        run: npx tauri build --no-bundle

      - name: Verify EXE exists
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/yk-pubengine.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Portable EXE was not produced: $exe"
            exit 1
          }
          Get-Item $exe | Select-Object FullName, Length

      - name: Upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: YK-PubEngine-Windows-Portable-W5
          path: src-tauri/target/release/yk-pubengine.exe
          if-no-files-found: error
