name: Build Windows Desktop Portable EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install JavaScript dependencies
        run: npm install

      - name: Build Portable EXE
        run: npx tauri build --no-bundle

      - name: Verify EXE exists
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/yk-pubengine.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Portable EXE was not produced: $exe"
            exit 1
          }
          Get-Item $exe | Select-Object FullName, Length

      - name: Upload Portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: YK-PubEngine-Windows-Portable-W1
          path: src-tauri/target/release/yk-pubengine.exe
          if-no-files-found: error
