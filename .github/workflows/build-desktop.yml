name: Build Windows Desktop EXE

on:
  workflow_dispatch:

jobs:
  build-tauri:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        run: npm install @tauri-apps/cli@v1

      - name: Auto-Crop and Generate Icons
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $srcPath = Join-Path $PWD "src-tauri/original-icon.png"
          $destPath = Join-Path $PWD "src-tauri/app-icon.png"
          $srcImg = [System.Drawing.Image]::FromFile($srcPath)
          $minDim = [int][Math]::Min($srcImg.Width, $srcImg.Height)
          $x = [int][Math]::Floor(($srcImg.Width - $minDim) / 2)
          $y = [int][Math]::Floor(($srcImg.Height - $minDim) / 2)
          $destBmp = New-Object System.Drawing.Bitmap(512, 512)
          $g = [System.Drawing.Graphics]::FromImage($destBmp)
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $srcRect = New-Object System.Drawing.Rectangle($x, $y, $minDim, $minDim)
          $destRect = New-Object System.Drawing.Rectangle(0, 0, 512, 512)
          $g.DrawImage($srcImg, $destRect, $srcRect, [System.Drawing.GraphicsUnit]::Pixel)
          $destBmp.Save($destPath, [System.Drawing.Imaging.ImageFormat]::Png)
          $g.Dispose()
          $destBmp.Dispose()
          $srcImg.Dispose()
          npx tauri icon $destPath

      - name: Build Tauri EXE directly
        run: npx tauri build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YK-PubEngine-Windows
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/**/*.exe
