name: Generate Windows Obfuscated Variants

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-windows:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install obfuscator
        run: npm install javascript-obfuscator

      - name: Generate Windows variants
        run: node scripts/generate-windows-variants.js

      - name: Verify 100 Windows variants
        shell: bash
        run: |
          ar_count=$(find functions/tool-variants-windows-ar -maxdepth 1 -name 'variant-*.html' | wc -l)
          en_count=$(find functions/tool-variants-windows-en -maxdepth 1 -name 'variant-*.html' | wc -l)
          test "$ar_count" -eq 50
          test "$en_count" -eq 50
          echo "Windows Arabic variants: $ar_count"
          echo "Windows English variants: $en_count"

      - name: Commit and push Windows variants
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add functions/tool-variants-windows-ar functions/tool-variants-windows-en
          git commit -m "توليد نسخ Windows المموهة (عربي وإنجليزي)" || echo "لا تغييرات"
          git push
