name: Generate Windows Tool Variants
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save javascript-obfuscator@4.1.1
      - run: node scripts/generate-windows-variants.js
      - shell: bash
        run: |
          test "$(find functions/tool-variants-windows-ar -maxdepth 1 -name 'variant-*.html' | wc -l)" -eq 50
          test "$(find functions/tool-variants-windows-en -maxdepth 1 -name 'variant-*.html' | wc -l)" -eq 50
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/tool-variants-windows-ar functions/tool-variants-windows-en
          git diff --cached --quiet || git commit -m "Generate Windows Arabic and English tool variants"
          git push
