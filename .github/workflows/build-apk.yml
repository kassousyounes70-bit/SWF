name: Build KDP Tool APK

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: استنساخ المستودع
        uses: actions/checkout@v4

      - name: تثبيت Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: تثبيت أداة تشويه الكود
        run: npm install javascript-obfuscator@4

      - name: تشويه كود الأداة وحقن جسر الأندرويد
        run: node scripts/obfuscate.js

      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: تثبيت Android SDK
        uses: android-actions/setup-android@v3

      - name: إعداد Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: توليد ملفات غلاف Gradle المفقودة (Wrapper Generation)
        run: gradle wrapper --gradle-version 8.7

      - name: منح صلاحيات التنفيذ لغلاف Gradle
        run: chmod +x ./gradlew

      - name: استعادة ملف التوقيع من السر المحفوظ
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: بناء APK (نسخة إصدار موقّعة رسميًا)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.keystore \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: رفع ملف APK الناتج
        uses: actions/upload-artifact@v4
        with:
          name: kdp-tool-release-apk
          path: app/build/outputs/apk/release/app-release.apk
