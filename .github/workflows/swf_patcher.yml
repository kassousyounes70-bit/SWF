name: N-CORE SWF Reverse Engineering Pipeline

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  decompile_and_patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install XVFB (Fake Display for Java)
        run: |
          echo "Installing Virtual Framebuffer to prevent Java Headless crashes..."
          sudo apt-get update && sudo apt-get install -y xvfb

      - name: Download and Extract JPEXS FFDec
        run: |
          wget https://github.com/jindrapetrik/jpexs-decompiler/releases/download/version14.4.0/ffdec_14.4.0.zip
          unzip -q ffdec_14.4.0.zip -d ffdec
          chmod +x ffdec/ffdec.sh

      - name: Download Flex SDK (The User's Strategy)
        run: |
          echo "Downloading Apache Flex SDK..."
          wget https://archive.apache.org/dist/flex/4.16.1/binaries/apache-flex-sdk-4.16.1-bin.zip
          # تطبيق فكرتك: فك ضغط الحزمة مباشرة داخل بطن المحرك
          unzip -q apache-flex-sdk-4.16.1-bin.zip -d ffdec/flex_sdk
          chmod +x -R ffdec/flex_sdk/bin/

      - name: Check Execution Mode Extract vs Patch
        id: check_mode
        run: |
          if [ ! -d "src_code" ]; then
            echo "MODE=EXTRACT" >> $GITHUB_ENV
          else
            echo "MODE=PATCH" >> $GITHUB_ENV
          fi

      - name: "Phase 1 - Extract ActionScript Source"
        if: env.MODE == 'EXTRACT'
        run: |
          echo "Initiating blind extraction protocol..."
          mkdir src_code
          xvfb-run java -jar ffdec/ffdec.jar -export script src_code game.swf
          echo "Extraction complete. Committing source code for mobile review."

      - name: Commit Extracted Source Code
        if: env.MODE == 'EXTRACT'
        run: |
          git config --global user.name "N-CORE Automator"
          git config --global user.email "automator@n-core.dev"
          git add src_code/
          git commit -m "Automated SWF Extraction: Ready for mobile review"
          git push

      - name: "Phase 2 - Inject Patched Script and Rebuild SWF"
        if: env.MODE == 'PATCH'
        run: |
          echo "Initiating bytecode injection protocol..."
          # استخدام الشاشة الوهمية مع تمرير المسار الداخلي للحزمة
          xvfb-run java -jar ffdec/ffdec.jar -config flexSdkPath="flex_sdk" -importScript game.swf patched_game.swf src_code/
          echo "Injection complete. Generating patched SWF artifact."

      - name: Upload Patched SWF Artifact
        if: env.MODE == 'PATCH'
        uses: actions/upload-artifact@v4
        with:
          name: N-CORE_Patched_Game
          path: patched_game.swf
