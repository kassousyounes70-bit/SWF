name: N-CORE The Automator Protocol (Bytecode Lobotomy)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  execute_lobotomy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Equip The Forbidden Weapon (Compile RABCDAsm)
        run: |
          echo "Installing LLVM D Compiler to forge the weapon..."
          sudo apt-get update && sudo apt-get install -y ldc
          echo "Cloning RABCDAsm (Raw Bytecode Assembler)..."
          git clone https://github.com/CyberShadow/RABCDAsm.git
          cd RABCDAsm
          echo "Compiling raw bytecode tools for maximum performance..."
          ldc2 -O -release src/*.d
          sudo cp abcexport abcreplace rabcdasm rabcasm /usr/local/bin/
          cd ..

      - name: Disassemble SWF (Extract The Brain)
        run: |
          echo "Extracting ActionScript ByteCode (ABC) from SWF..."
          abcexport game.swf
          echo "Disassembling machine code into raw ASASM assembly..."
          rabcdasm game-0.abc

      - name: Execute Bytecode Lobotomy (The Amputation)
        run: |
          echo "Initiating surgical strike on UI components to force automated bypass..."
          
          # استهداف الملفات المزعجة المسؤولة عن البرنامج التعليمي
          TARGETS=("TutorialNotification" "BeginingTutorial")
          
          for class in "${TARGETS[@]}"; do
            FILE=$(find game-0 -name "${class}.class.asasm")
            if [ -n "$FILE" ]; then
              echo "Lobotomizing logic loops in: ${class}"
              
              # تفريغ دوال frame1 و frame12 التي تحتوي على الحلقات التكرارية وأوامر الإيقاف
              # نحقن أمراً مباشراً بالعودة (returnvoid) لشل النافذة وجعل اللعبة تتخطاها فوراً
              perl -0777 -pi -e 's/(QName\(PackageNamespace\(""\), "frame1(?:2)?"\).*?code\s+)(.*?)(end ; code)/${1}getlocal0\npushscope\nreturnvoid\n${3}/gs' "$FILE"
              
              echo "Logic wiped successfully for ${class}."
            else
              echo "Target ${class} not found in bytecode, skipping."
            fi
          done
          
          echo "Lobotomy complete. Blocking UIs have been neutralized at the machine level."

      - name: Reassemble and Reconstruct SWF
        run: |
          echo "Reassembling modified machine code back into binary..."
          rabcasm game-0/game-0.main.asasm
          echo "Injecting neutralized brain back into the SWF..."
          abcreplace game.swf 0 game-0.abc
          mv game.swf N-CORE_Automated_Game.swf

      - name: Upload The Ultimate Artifact
        uses: actions/upload-artifact@v4
        with:
          name: N-CORE_Automated_Game
          path: N-CORE_Automated_Game.swf
