name: Build YK Coupons APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk-headless \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache

      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install buildozer==1.5.0 "Cython==0.29.33" virtualenv

      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-

      # الخط العربي: يُولَّد هنا لأن المستودع يحتوي على ملفين فقط (main.py + buildozer.spec)
      - name: Download Arabic font
        run: |
          mkdir -p assets
          curl -g -L -f -o assets/Arabic.ttf \
            "https://github.com/google/fonts/raw/main/ofl/notonaskharabic/NotoNaskhArabic%5Bwght%5D.ttf" \
          || curl -g -L -f -o assets/Arabic.ttf \
            "https://github.com/aliftype/amiri/raw/main/Amiri-Regular.ttf" \
          || echo "WARNING: font download failed"
          ls -la assets/ || true

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YK-Coupon-Generator-debug
          path: bin/*.apk
