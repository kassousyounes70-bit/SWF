name: Build Coupon Generator APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate the standalone project
        run: python3 generate_coupon_app.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bootstrap Gradle wrapper for the generated project
        working-directory: coupon-generator
        run: gradle wrapper --gradle-version 8.7

      - name: Grant execute permission for gradlew
        working-directory: coupon-generator
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: coupon-generator
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YK-Coupon-Generator-debug
          path: coupon-generator/app/build/outputs/apk/debug/app-debug.apk
