name: Build Coupon Generator APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :coupon-generator:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YK-Coupon-Generator-debug
          path: coupon-generator/build/outputs/apk/debug/coupon-generator-debug.apk
