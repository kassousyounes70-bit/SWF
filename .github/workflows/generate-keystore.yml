name: Generate Release Keystore

on:
  workflow_dispatch:
    inputs:
      keystore_password:
        description: 'كلمة مرور الـ keystore (اخترها بنفسك، احفظها جيدًا)'
        required: true
      key_alias:
        description: 'اسم مستعار للمفتاح (مثلاً: ykpubengine)'
        required: true
      key_password:
        description: 'كلمة مرور المفتاح نفسه (يمكن أن تطابق كلمة مرور الـ keystore)'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.keystore_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=YK PubEngine, OU=Dev, O=NostGames, L=Unknown, ST=Unknown, C=US"

      - name: Convert to Base64
        run: base64 -w 0 release.keystore > keystore_base64.txt

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: |
            release.keystore
            keystore_base64.txt
