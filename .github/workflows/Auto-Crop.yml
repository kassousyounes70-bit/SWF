name: Auto-Crop and Generate Icons
shell: Pwsh        run: |
          Add-Type -AssemblyName System.Drawing
          
          # تحميل الصورة الأصلية
          $srcImg = [System.Drawing.Image]::FromFile("src-tauri/original-icon.png")
          
          # حساب مربع القص من المنتصف (Center Crop)
          $minDim = [Math]::Min($srcImg.Width, $srcImg.Height)
          $x = ($srcImg.Width - $minDim) / 2
          $y = ($srcImg.Height - $minDim) / 2
          
          # إنشاء صورة مربعة بدقة 512x512 بأعلى جودة
          $destBmp = New-Object System.Drawing.Bitmap(512, 512)
          $g = [System.Drawing.Graphics]::FromImage($destBmp)
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          
          # رسم وتصغير الجزء المقتطع
          $srcRect = New-Object System.Drawing.Rectangle($x, $y, $minDim, $minDim)
          $destRect = New-Object System.Drawing.Rectangle(0, 0, 512, 512)
          $g.DrawImage($srcImg, $destRect, $srcRect, [System.Drawing.GraphicsUnit]::Pixel)
          
          # حفظ الصورة المربعة النهائية
          $destBmp.Save("src-tauri/app-icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          
          # تنظيف الذاكرة
          $g.Dispose()
          $destBmp.Dispose()
          $srcImg.Dispose()
          
          # توليد حزمة الأيقونات المخصصة لويندوز تلقائياً
          npx tauri icon src-tauri/app-icon.png
