name: Get Release SHA-256 Fingerprint

on:
  workflow_dispatch: {}

jobs:
  fingerprint:
    runs-on: ubuntu-latest
    steps:
      - name: استعادة ملف التوقيع من السر المحفوظ
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: استخراج بصمة SHA-256
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list -v \
            -keystore release.keystore \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD" | grep "SHA256:"
