<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YK PubEngine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#13131a; --bg-panel:#1e1e27; --bg-panel-2:#262631;
    --pixel-border:#08080b; --ink:#ece7d8; --ink-dim:#9d97a8;
    --accent:#5ec98f; --accent-dim:#2f5f45; --accent-2:#ffb454;
    --danger:#ff5d6c; --info:#5aa9e6; --gold:#d4af37;
    --font-pixel:'Press Start 2P',monospace; --font-body:'Tajawal',sans-serif;
    --shadow-sm:3px 3px 0 var(--pixel-border); --shadow-md:5px 5px 0 var(--pixel-border);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden;max-width:100vw;min-height:100%;}
  body{background:var(--bg-deep);color:var(--ink);font-family:var(--font-body);line-height:1.6;position:relative;min-height:100vh;image-rendering:pixelated;display:flex;align-items:center;justify-content:center;padding:22px 12px;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.09) 0,rgba(0,0,0,.09) 1px,transparent 1px,transparent 3px);opacity:.35;z-index:999;mix-blend-mode:overlay;}
  .login-wrap{width:100%;max-width:430px;margin:0 auto;position:relative;z-index:2;}
  .eyebrow{font-family:var(--font-pixel);font-size:.55rem;letter-spacing:.05em;color:var(--bg-deep);background:var(--accent);display:inline-block;padding:5px 8px;box-shadow:var(--shadow-sm);}
  .brand-title{margin:14px 0 6px;font-family:var(--font-pixel);font-size:1rem;line-height:1.8;color:var(--accent);text-shadow:3px 3px 0 var(--pixel-border);}
  .brand-sub{margin:0 0 18px;color:var(--ink-dim);font-size:.82rem;}
  .cartridge{position:relative;background:var(--bg-panel);border:3px solid var(--pixel-border);box-shadow:var(--shadow-md);padding:20px 16px 18px;margin-top:18px;}
  .cartridge::before{content:"";position:absolute;top:-3px;right:-3px;left:-3px;height:8px;background:var(--tab-color,var(--accent));border-bottom:3px solid var(--pixel-border);}
  .cartridge-tab{font-family:var(--font-pixel);font-size:.55rem;color:var(--bg-deep);background:var(--tab-color,var(--accent));display:inline-block;padding:6px 10px;margin:-38px 0 14px auto;position:relative;box-shadow:var(--shadow-sm);float:left;}
  .cartridge h2,.cartridge h3{font-size:1rem;margin:0 0 12px;padding-bottom:8px;border-bottom:2px dashed #3a3a48;clear:both;}
  .hint{font-size:.76rem;color:var(--ink-dim);margin:-5px 0 12px;}
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 14px;}
  .tab{font-family:var(--font-body);font-weight:700;font-size:.84rem;text-align:center;padding:10px 8px;background:var(--bg-panel-2);color:var(--ink-dim);border:3px solid var(--pixel-border);box-shadow:var(--shadow-sm);cursor:pointer;}
  .tab.active{background:var(--accent);color:var(--bg-deep);}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
  label{font-size:.78rem;font-weight:700;color:var(--ink-dim);display:block;margin-bottom:3px;}
  input{width:100%;font-family:var(--font-body);font-size:.86rem;color:var(--ink);background:var(--bg-panel-2);border:3px solid var(--pixel-border);box-shadow:var(--shadow-sm);border-radius:0;padding:10px 12px;outline:none;}
  input:focus{border-color:var(--accent);}
  button{width:100%;font-family:var(--font-body);font-size:.9rem;color:var(--bg-deep);background:var(--accent);border:3px solid var(--pixel-border);box-shadow:var(--shadow-sm);border-radius:0;padding:11px 14px;cursor:pointer;font-weight:700;margin-top:4px;}
  button:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--pixel-border);}
  button:disabled{opacity:.35;cursor:not-allowed;}
  #msg{margin-top:12px;text-align:center;min-height:20px;font-size:.76rem;color:var(--ink-dim);}
  #forgotLink{display:block;text-align:center;margin-top:12px;color:var(--accent-2);font-size:.76rem;cursor:pointer;text-decoration:none;}
  .lang-panel{width:100%;max-width:430px;}
  #langScreen{display:none;width:100%;}
  .lang-option{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:13px 14px;margin:10px 0;background:var(--bg-panel-2);color:var(--ink);font-size:.88rem;font-weight:700;border:3px solid var(--pixel-border);box-shadow:var(--shadow-sm);cursor:pointer;}
  .lang-option:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--pixel-border);background:var(--accent);color:var(--bg-deep);}
  .lang-flag{font-size:20px;image-rendering:auto;}
  .splash-stage{position:relative;width:260px;height:260px;overflow:visible;}
  .splash-canvas{position:absolute;inset:0;width:260px;height:260px;image-rendering:pixelated;}
  .splash-source{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}
  #splashScreen{position:fixed;inset:0;background:#000;display:flex;align-items:center;justify-content:center;z-index:300;overflow:hidden;}
  @keyframes glitchSlice{0%{clip-path:inset(0);transform:translate(0,0)}10%{clip-path:inset(10% 0 60% 0);transform:translate(-8px,2px)}20%{clip-path:inset(70% 0 5% 0);transform:translate(6px,-3px)}30%{clip-path:inset(30% 0 40% 0);transform:translate(-4px,4px)}40%{clip-path:inset(50% 0 20% 0);transform:translate(8px,0)}50%{clip-path:inset(5% 0 80% 0);transform:translate(-6px,-2px)}60%{clip-path:inset(85% 0 2% 0);transform:translate(4px,3px)}70%{clip-path:inset(20% 0 55% 0);filter:hue-rotate(90deg)}85%{clip-path:inset(0);opacity:.3;filter:brightness(3) contrast(2)}100%{clip-path:inset(0);opacity:0;filter:none}}
  .glitching{animation:glitchSlice .6s steps(2,end) forwards;}
  @media(max-width:420px){body{padding:18px 10px}.cartridge{padding:18px 13px}.brand-title{font-size:.88rem}.eyebrow{font-size:.48rem}}
</style>

<style id="yk-desktop-overrides">
html, body { min-width: 900px !important; }
body { overflow-x: hidden !important; }
</style>

</head>

  var KDP_LANG = "ar";

  (function runSplashAnimation() {
    const stage = document.getElementById('splashStage');
    const source = document.getElementById('splashSource');
    const SIZE = 260;
    const CELL = 1;                 // 1px = أقصى دقة ممكنة لحواف الشعار
    const FORMATION_MS = 8000;      // التشكل نفسه = 8 ثوانٍ
    const GLOW_MS = 650;
    const HOLD_MS = 220;
    const FADE_MS = 350;

    // Canvas واحد بدل آلاف عناصر DOM: أسرع على Android، والأهم أن
    // المربعات تصل إلى إحداثيات صحيحة بدون دوران/كسور عند اكتمال الشعار.
    const canvas = document.createElement('canvas');
    canvas.width = SIZE;
    canvas.height = SIZE;
    canvas.className = 'splash-canvas';
    stage.appendChild(canvas);
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    let particles = [];
    let started = false;
    let formationStart = 0;

    function isLogoPixel(r, g, b) {
      // نرفض الخلفية الداكنة ونقبل الأخضر/الذهبي فقط.
      const green = (g > 90 && g > r * 1.45 && g > b * 1.15);
      const gold  = (r > 150 && g > 105 && r > b * 1.65);
      return green || gold;
    }

    function makeParticles() {
      ctx.clearRect(0, 0, SIZE, SIZE);
      ctx.drawImage(source, 0, 0, SIZE, SIZE);
      const pixels = ctx.getImageData(0, 0, SIZE, SIZE).data;
      particles = [];

      // نختار الخلية من مركزها، لا من متوسطها.
      // بهذه الطريقة لا تنتفخ الحواف بسبب بكسلات anti-aliasing المجاورة للخلفية.
      for (let y = 0; y < SIZE; y += CELL) {
        for (let x = 0; x < SIZE; x += CELL) {
          const cx = Math.min(x + 1, SIZE - 1);
          const cy = Math.min(y + 1, SIZE - 1);
          const i = (cy * SIZE + cx) * 4;
          const r = pixels[i], g = pixels[i + 1], b = pixels[i + 2];
          if (!isLogoPixel(r, g, b)) continue;

          const angle = Math.random() * Math.PI * 2;
          // نقطة البداية تكون خارج شاشة العرض نفسها، وليس حول حدود المربع.
          const vw = Math.max(window.innerWidth, 320);
          const vh = Math.max(window.innerHeight, 480);
          const side = Math.floor(Math.random() * 4);
          const margin = 60 + Math.random() * 180;
          let startScreenX, startScreenY;
          if (side === 0) { startScreenX = -margin; startScreenY = Math.random() * vh; }
          else if (side === 1) { startScreenX = vw + margin; startScreenY = Math.random() * vh; }
          else if (side === 2) { startScreenX = Math.random() * vw; startScreenY = -margin; }
          else { startScreenX = Math.random() * vw; startScreenY = vh + margin; }

          // تحويل إحداثيات الشاشة إلى إحداثيات المسرح.
          const stageRect = stage.getBoundingClientRect();
          const sx = startScreenX - stageRect.left;
          const sy = startScreenY - stageRect.top;

          particles.push({
            x: x,
            y: y,
            r: r,
            g: g,
            b: b,
            sx: sx,
            sy: sy,
            delay: Math.random() * 520,
            seed: Math.random() * Math.PI * 2
          });
        }
      }

      // نرسم بداية خفية قبل بدء الحركة.
      ctx.clearRect(0, 0, SIZE, SIZE);
    }

    function ease(t) {
      // حركة سريعة في البداية ثم استقرار دقيق في موضع الحرف.
      return 1 - Math.pow(1 - t, 3);
    }

    function draw(now) {
      const elapsed = now - formationStart;
      ctx.clearRect(0, 0, SIZE, SIZE);

      let glow = false;
      if (elapsed >= FORMATION_MS && elapsed < FORMATION_MS + GLOW_MS) glow = true;

      if (glow) {
        ctx.shadowBlur = 15;
        ctx.shadowColor = 'rgba(110,255,190,0.95)';
      } else {
        ctx.shadowBlur = 0;
      }

      for (let i = 0; i < particles.length; i++) {
        const p = particles[i];
        let t = (elapsed - p.delay) / (FORMATION_MS - p.delay);
        t = Math.max(0, Math.min(1, t));
        const e = ease(t);

        // حركة خفيفة أثناء الرحلة فقط؛ عند النهاية تصبح الإحداثيات صحيحة تمامًا.
        const wobble = t < 0.92 ? (1 - t) * 1.4 * Math.sin(p.seed + elapsed * 0.006) : 0;
        const x = p.sx + (p.x - p.sx) * e + wobble;
        const y = p.sy + (p.y - p.sy) * e - wobble * 0.5;

        if (t <= 0) continue;

        const alpha = t < 0.12 ? t / 0.12 : 1;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = 'rgb(' + p.r + ',' + p.g + ',' + p.b + ')';

        // لا fractional size ولا scale عند النهاية: كل بكسل يطابق قناع الشعار.
        ctx.fillRect(Math.round(x), Math.round(y), CELL, CELL);
      }

      ctx.globalAlpha = 1;

      if (elapsed < FORMATION_MS + GLOW_MS + HOLD_MS) {
        requestAnimationFrame(draw);
      } else {
        // بعد التوهج يعود الشعار إلى لونه الطبيعي لحظة قصيرة، ثم ننتقل للغة.
        finishSplash();
      }
    }

    function finishSplash() {
      const splash = document.getElementById('splashScreen');
      splash.style.transition = 'opacity ' + FADE_MS + 'ms ease';
      splash.style.opacity = '0';
      setTimeout(function () {
        splash.style.display = 'none';
        document.getElementById('langScreen').style.display = 'block';
      }, FADE_MS);
    }

    function start() {
      if (started) return;
      started = true;
      makeParticles();
      formationStart = performance.now();
      requestAnimationFrame(draw);
    }

    if (source.complete && source.naturalWidth) {
      start();
    } else {
      source.addEventListener('load', start, { once: true });
    }
  })();

  function applyLanguage(lang) {
    KDP_LANG = lang;
    var t = KDP_I18N[lang];

    setMode(mode);
  }

  document.getElementById("langArBtn").addEventListener("click", function () {
    document.getElementById("langScreen").style.display = "none";
    document.getElementById("loginBox").style.display = "block";
    applyLanguage("ar");
  });

  document.getElementById("langEnBtn").addEventListener("click", function () {
    document.getElementById("langScreen").style.display = "none";
    document.getElementById("loginBox").style.display = "block";
    applyLanguage("en");
  });

  var mode = "create";
  var tabLogin = document.getElementById("tabLogin");
  var tabCreate = document.getElementById("tabCreate");
  var actionBtn = document.getElementById("actionBtn");
  var msg = document.getElementById("msg");
  var forgotLink = document.getElementById("forgotLink");

  function setMode(newMode) {
    mode = newMode;
    var t = KDP_I18N[KDP_LANG];
    tabLogin.classList.toggle("active", mode === "login");
    tabCreate.classList.toggle("active", mode === "create");
    actionBtn.textContent = mode === "login" ? t.actionLogin : t.actionCreate;
    forgotLink.style.display = mode === "login" ? "block" : "none";
    document.getElementById("formTitle").textContent = mode === "create" ? t.actionCreate : t.actionLogin;
    document.getElementById("formHint").textContent = mode === "create" ? (KDP_LANG === "ar" ? "أنشئ حسابك للبدء باستخدام المحرك." : "Create your account to start using the engine.") : (KDP_LANG === "ar" ? "سجّل الدخول للمتابعة إلى المحرك." : "Sign in to continue to the engine.");
    document.getElementById("password").setAttribute("autocomplete", mode === "create" ? "new-password" : "current-password");
    msg.textContent = "";
  }

  tabLogin.addEventListener("click", function () { setMode("login"); });
  tabCreate.addEventListener("click", function () { setMode("create"); });

  forgotLink.addEventListener("click", function () {
    var t = KDP_I18N[KDP_LANG];
    var email = document.getElementById("email").value.trim();
    if (!email) {
      msg.textContent = t.enterEmailFirst;
      return;
    }
    msg.textContent = t.sendingReset;
    fetch("https://yk-pubengine-v1.onrender.com/resetPassword", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email }),
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        msg.textContent = data.message || data.error || t.failedGeneric;
      })
      .catch(function () {
        msg.textContent = t.serverConnectFailed;
      });
  });

  function fetchTool(ticket) {
    var devicePromise = (typeof DesktopBridge !== "undefined" && DesktopBridge.getDeviceId)
      ? DesktopBridge.getDeviceId() : Promise.reject(new Error("Windows bridge is unavailable"));

    devicePromise.then(function (deviceId) {
      return fetch("https://yk-pubengine-v1.onrender.com/getTool", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ticket: ticket, deviceId: deviceId, lang: KDP_LANG, platform: "windows" }),
      });
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.success) {
          document.body.classList.add("glitching");
          setTimeout(function () {
            // IMPORTANT: do not inject the tool with document.open()/document.write().
            // In Android WebView this can leave the downloaded tool in a replaced
            // document context where viewport/fixed-position UI behaves incorrectly.
            // Navigate to the returned HTML as a real top-level document instead.
            var toolHtml = data.html;
            var blob = new Blob([toolHtml], { type: "text/html;charset=utf-8" });
            var toolUrl = URL.createObjectURL(blob);

            // Replace the login document with a genuine navigation. This gives the
            // KDP tool its own document/viewport, so position:fixed elements are
            // anchored to the WebView viewport rather than the login document.
            window.location.replace(toolUrl);
          }, 550);
        } else {
          var t = KDP_I18N[KDP_LANG];
          if (data.errorCode === "COUPON_USED") {
            msg.innerHTML = t.couponUsedTitle +
              '<br><a id="buyCouponLink" href="" style="display:inline-block;margin-top:8px;color:#4a90e2;">' +
              t.buyNewCoupon + '</a>';
          } else {
            msg.textContent = t.toolError + (data.error || t.toolLoadFailed);
          }
        }
      })
    })
      .catch(function () {
        msg.textContent = KDP_I18N[KDP_LANG].serverConnectFailed;
      });
  }

  actionBtn.addEventListener("click", function () {
    var t = KDP_I18N[KDP_LANG];
    var coupon = document.getElementById("coupon").value.trim();
    var email = document.getElementById("email").value.trim();
    var password = document.getElementById("password").value;

    if (!coupon || !email || !password) {
      msg.textContent = t.fillAllFields;
      return;
    }

    actionBtn.disabled = true;
    msg.textContent = t.processing;

    var call = mode === "login" ? loginAccount : createAccount;

    call(coupon, email, password).then(function (result) {
      actionBtn.disabled = false;
      if (result.ok && result.data.success) {
        if (mode === "login" && result.data.ticket) {
          msg.textContent = result.data.message;
          fetchTool(result.data.ticket);
        } else {
          msg.textContent = result.data.message;
        }
      } else {
        if (result.data.errorCode === "COUPON_USED") {
          msg.innerHTML = t.couponUsedTitle +
            '<br><a id="buyCouponLink" href="" style="display:inline-block;margin-top:8px;color:#4a90e2;">' +
            t.buyNewCoupon + '</a>';
        } else {
          msg.textContent = result.data.error || t.failedGeneric;
        }
      }
    });
  });
</script>
</body>
</html>
