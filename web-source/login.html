<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YK PubEngine</title>
<style>
  body { font-family: sans-serif; background:#0d0d0d; color:#eee; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  .box { width:90%; max-width:340px; }
  input { width:100%; padding:12px; margin:8px 0; border-radius:8px; border:1px solid #444; background:#1a1a1a; color:#fff; box-sizing:border-box; }
  .tabs { display:flex; margin-bottom:12px; border-radius:8px; overflow:hidden; }
  .tab { flex:1; padding:10px; text-align:center; background:#1a1a1a; cursor:pointer; }
  .tab.active { background:#4a90e2; }
  button { width:100%; padding:12px; border:none; border-radius:8px; background:#4a90e2; color:#fff; font-size:16px; margin-top:10px; }
  button:disabled { background:#333; }
  #msg { margin-top:10px; text-align:center; min-height:20px; font-size:14px; }

  /* ✅ شاشة اختيار اللغة */
  #langScreen { width:90%; max-width:340px; text-align:center; }
  #langScreen h2 { margin-bottom:24px; }
  .lang-option {
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; padding:16px; margin:10px 0; border-radius:10px;
    border:1px solid #444; background:#1a1a1a; color:#fff;
    font-size:17px; cursor:pointer;
  }
  .lang-option:active { background:#2a2a2a; }
  .lang-flag { font-size:22px; }

  /* ✅ مؤثر الجليتش - تحلل بكسلي */
  @keyframes glitchSlice {
    0% { clip-path: inset(0 0 0 0); transform: translate(0,0); }
    10% { clip-path: inset(10% 0 60% 0); transform: translate(-8px,2px); }
    20% { clip-path: inset(70% 0 5% 0); transform: translate(6px,-3px); }
    30% { clip-path: inset(30% 0 40% 0); transform: translate(-4px,4px); }
    40% { clip-path: inset(50% 0 20% 0); transform: translate(8px,0); }
    50% { clip-path: inset(5% 0 80% 0); transform: translate(-6px,-2px); }
    60% { clip-path: inset(85% 0 2% 0); transform: translate(4px,3px); }
    70% { clip-path: inset(20% 0 55% 0); filter: hue-rotate(90deg); }
    85% { clip-path: inset(0 0 0 0); opacity: 0.3; filter: brightness(3) contrast(2); }
    100% { clip-path: inset(0 0 0 0); opacity: 0; filter: none; }
  }
  .glitching { animation: glitchSlice 0.6s steps(2, end) forwards; }
</style>
</head>
<body>

<!-- ✅ شاشة اختيار اللغة (تظهر أولًا، قبل كل شيء) -->
<div id="langScreen">
  <h2>YK PubEngine</h2>
  <div class="lang-option" id="langArBtn">
    <span class="lang-flag">🇸🇦</span>
    <span>العربية</span>
  </div>
  <div class="lang-option" id="langEnBtn">
    <span class="lang-flag">🇺🇸</span>
    <span>English</span>
  </div>
</div>

<!-- ✅ شاشة الدخول (مخفية حتى يُختار اللغة) -->
<div class="box" id="loginBox" style="display:none;">
  <h2 style="text-align:center;">YK PubEngine</h2>

  <div class="tabs">
    <div class="tab active" id="tabLogin"></div>
    <div class="tab" id="tabCreate"></div>
  </div>

  <input id="coupon" type="text">
  <input id="email" type="email">
  <input id="password" type="password">
  <button id="actionBtn"></button>
  <div id="msg"></div>
</div>

<script>
  // ==== نظام الترجمة البسيط (i18n) للملف الغبي ====
  var KDP_I18N = {
    ar: {
      tabLogin: "دخول",
      tabCreate: "إنشاء حساب",
      couponPlaceholder: "كود الكوبون",
      emailPlaceholder: "البريد الإلكتروني",
      passwordPlaceholder: "كلمة المرور",
      actionLogin: "دخول",
      actionCreate: "إنشاء حساب",
      fillAllFields: "يرجى ملء جميع الحقول",
      processing: "جاري المعالجة...",
      failedGeneric: "فشل الإجراء",
      toolError: "خطأ: ",
      toolLoadFailed: "تعذّر تحميل الأداة",
      serverConnectFailed: "تعذّر الاتصال بالخادم عند تحميل الأداة",
    },
    en: {
      tabLogin: "Login",
      tabCreate: "Create Account",
      couponPlaceholder: "Coupon code",
      emailPlaceholder: "Email address",
      passwordPlaceholder: "Password",
      actionLogin: "Login",
      actionCreate: "Create Account",
      fillAllFields: "Please fill in all fields",
      processing: "Processing...",
      failedGeneric: "Action failed",
      toolError: "Error: ",
      toolLoadFailed: "Failed to load the tool",
      serverConnectFailed: "Could not connect to the server while loading the tool",
    }
  };

  var KDP_LANG = "ar"; // القيمة الافتراضية، تُستبدل فور اختيار المستخدم

  function applyLanguage(lang) {
    KDP_LANG = lang;
    var t = KDP_I18N[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";

    tabLogin.textContent = t.tabLogin;
    tabCreate.textContent = t.tabCreate;
    document.getElementById("coupon").placeholder = t.couponPlaceholder;
    document.getElementById("email").placeholder = t.emailPlaceholder;
    document.getElementById("password").placeholder = t.passwordPlaceholder;
    setMode(mode); // لتحديث نص زر actionBtn بلغته الصحيحة
  }

  document.getElementById("langArBtn").addEventListener("click", function () {
    document.getElementById("langScreen").style.display = "none";
    document.getElementById("loginBox").style.display = "block";
    applyLanguage("ar");
  });

  document.getElementById("langEnBtn").addEventListener("click", function () {
    document.getElementById("langScreen").style.display = "none";
    document.getElementById("loginBox").style.display = "block";
    applyLanguage("en");
  });

  var mode = "login";
  var tabLogin = document.getElementById("tabLogin");
  var tabCreate = document.getElementById("tabCreate");
  var actionBtn = document.getElementById("actionBtn");
  var msg = document.getElementById("msg");

  function setMode(newMode) {
    mode = newMode;
    var t = KDP_I18N[KDP_LANG];
    tabLogin.classList.toggle("active", mode === "login");
    tabCreate.classList.toggle("active", mode === "create");
    actionBtn.textContent = mode === "login" ? t.actionLogin : t.actionCreate;
    msg.textContent = "";
  }

  tabLogin.addEventListener("click", function () { setMode("login"); });
  tabCreate.addEventListener("click", function () { setMode("create"); });

  // ✅ استدعاء الأداة الذكية بعد نجاح تسجيل الدخول
  function fetchTool(ticket) {
    var deviceId = (typeof AndroidBridge !== "undefined" && AndroidBridge.getDeviceId)
      ? AndroidBridge.getDeviceId() : "web-unknown-device";

    fetch("https://yk-pubengine-v1.onrender.com/getTool", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ ticket: ticket, deviceId: deviceId, lang: KDP_LANG }),
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.success) {
          // ✅ تفعيل مؤثر الجليتش
          document.body.classList.add("glitching");
          setTimeout(function () {
            document.open();
            document.write(data.html);
            document.close();
          }, 550);
        } else {
          var t = KDP_I18N[KDP_LANG];
          msg.textContent = t.toolError + (data.error || t.toolLoadFailed);
        }
      })
      .catch(function () {
        msg.textContent = KDP_I18N[KDP_LANG].serverConnectFailed;
      });
  }

  actionBtn.addEventListener("click", function () {
    var t = KDP_I18N[KDP_LANG];
    var coupon = document.getElementById("coupon").value.trim();
    var email = document.getElementById("email").value.trim();
    var password = document.getElementById("password").value;

    if (!coupon || !email || !password) {
      msg.textContent = t.fillAllFields;
      return;
    }

    actionBtn.disabled = true;
    msg.textContent = t.processing;

    var call = mode === "login" ? loginAccount : createAccount;

    call(coupon, email, password).then(function (result) {
      actionBtn.disabled = false;
      if (result.ok && result.data.success) {
        if (mode === "login" && result.data.ticket) {
          msg.textContent = result.data.message;
          fetchTool(result.data.ticket);
        } else {
          msg.textContent = result.data.message;
        }
      } else {
        msg.textContent = result.data.error || t.failedGeneric;
      }
    });
  });
</script>
</body>
</html>
