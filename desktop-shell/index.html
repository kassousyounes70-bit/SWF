<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YK PubEngine</title>
  <style>
    /* NOTE: the main window now loads login-desktop.html directly (see
       src-tauri/tauri.conf.json -> app.windows[0].url), so this file is no
       longer the entry point. It is kept working as a fallback wrapper (and
       the height fix below is still correct if it is ever used again).
       Historical bug: `body { height: 100% }` does nothing unless <html>
       has a resolved height, so the iframe collapsed to its default ~150px
       and the window showed only a dark sliver at the top. */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #13131a;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <iframe src="login-desktop.html" title="YK PubEngine"></iframe>
  <script>
    (function () {
      function log(level, msg) {
        try {
          if (window.__TAURI__ && window.__TAURI__.core &&
              typeof window.__TAURI__.core.invoke === "function") {
            var p = window.__TAURI__.core.invoke("log_js_event", { level: level, message: msg });
            if (p && typeof p.catch === "function") p.catch(function () {});
          }
        } catch (_) {}
        try { console.log("[YK][" + level + "] " + msg); } catch (_) {}
      }
      var frame = document.querySelector("iframe");
      log("INFO", "index: bootstrap tauri=" + !!(window.__TAURI__ && window.__TAURI__.core) +
        " readyState=" + document.readyState);
      frame.addEventListener("load", function () {
        log("INFO", "index: iframe loaded, frame=" + frame.clientWidth + "x" + frame.clientHeight +
          " viewport=" + window.innerWidth + "x" + window.innerHeight);
      });
      frame.addEventListener("error", function () {
        log("ERROR", "index: iframe failed to load");
      });
    })();
  </script>
</body>
</html>
