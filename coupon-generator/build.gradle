plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.nostgames.kdpcoupons'
    compileSdk 34

    defaultConfig {
        applicationId "com.nostgames.kdpcoupons"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // أداة داخلية فقط لتوليد الكوبونات — لا تُوزَّع لأي عميل، لذا لا حاجة
    // لأي توقيع إصدار حقيقي أو أسرار GitHub Actions. تُبنى وتُثبَّت نسخة
    // Debug القياسية فقط (توقيع تجريبي تلقائي من Gradle نفسه).
    buildTypes {
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
}
